name: Keep Render API warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-render-api-warm
  cancel-in-progress: true

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wake and check the API
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            --max-time 270 --retry 2 --retry-delay 10 --retry-all-errors \
            https://spendwise-api-88bt.onrender.com/api/health
