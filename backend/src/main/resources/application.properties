spring.application.name=spendwise-api

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/spendwise}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:spendwise}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change-me-for-local-development}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

spring.jackson.default-property-inclusion=non_null

server.port=${SERVER_PORT:8080}
management.endpoints.web.exposure.include=health,info

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:replace-with-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:replace-with-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
spendwise.auth.frontend-success-url=${AUTH_SUCCESS_URL:http://localhost:3000/auth/callback}
spendwise.auth.frontend-origin=${FRONTEND_ORIGIN:http://localhost:3000}
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

spendwise.channel3.base-url=${CHANNEL3_BASE_URL:https://api.trychannel3.com}
spendwise.paypal.base-url=${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
spendwise.paypal.return-url=${PAYPAL_RETURN_URL:http://localhost:3000/checkout/return}
spendwise.paypal.cancel-url=${PAYPAL_CANCEL_URL:http://localhost:3000/checkout/cancel}
spendwise.paypal.client-id=${PAYPAL_CLIENT_ID:}
spendwise.paypal.client-secret=${PAYPAL_CLIENT_SECRET:}
springdoc.api-docs.path=/v3/api-docs
