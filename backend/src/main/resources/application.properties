
spring.application.name=spendwise-api

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/spendwise}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:spendwise}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:change-me-for-local-development}}

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
# External provider HTTP bounds
spendwise.http.connect-timeout-seconds=${SPENDWISE_HTTP_CONNECT_TIMEOUT_SECONDS:5}
spendwise.http.read-timeout-seconds=${SPENDWISE_HTTP_READ_TIMEOUT_SECONDS:20}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# Jackson
spring.jackson.default-property-inclusion=non_null

# Server
server.port=${SERVER_PORT:8080}

# Actuator
management.endpoints.web.exposure.include=health,info

# Google OAuth
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}

# Authentication
spendwise.auth.frontend-success-url=${AUTH_SUCCESS_URL:http://localhost:5173/}
spendwise.auth.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}

# Email verification (Resend)
spendwise.email.resend.api-key=${RESEND_API_KEY:}
spendwise.email.from=${RESEND_FROM_EMAIL:}

# Session cookies
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Channel3
spendwise.channel3.base-url=${CHANNEL3_BASE_URL:https://api.trychannel3.com}
spendwise.channel3.api-key=${CHANNEL3_API_KEY:}
spendwise.channel3.search-limit=${CHANNEL3_SEARCH_LIMIT:10}

# Gemini
spendwise.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
spendwise.gemini.api-key=${GEMINI_API_KEY:}
spendwise.gemini.model=${GEMINI_MODEL:gemini-3.8-flash}

# PayPal
spendwise.paypal.base-url=${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
spendwise.paypal.return-url=${PAYPAL_RETURN_URL:http://localhost:5173/checkout/return}
spendwise.paypal.cancel-url=${PAYPAL_CANCEL_URL:http://localhost:5173/checkout/cancel}
spendwise.paypal.vault-return-url=${PAYPAL_VAULT_RETURN_URL:http://localhost:5173/paypal/vault/return}
spendwise.paypal.vault-cancel-url=${PAYPAL_VAULT_CANCEL_URL:http://localhost:5173/paypal/vault/cancel}
spendwise.paypal.vault-encryption-key=${PAYPAL_VAULT_ENCRYPTION_KEY:}
spendwise.paypal.client-id=${PAYPAL_CLIENT_ID:}
spendwise.paypal.client-secret=${PAYPAL_CLIENT_SECRET:}
spendwise.paypal.webhook-id=${PAYPAL_WEBHOOK_ID:}

# Swagger
springdoc.api-docs.path=/v3/api-docs
