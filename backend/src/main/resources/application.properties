spring.application.name=spendwise-api

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/spendwise}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:spendwise}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change-me-for-local-development}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

spring.jackson.default-property-inclusion=non_null

server.port=${SERVER_PORT:8080}
management.endpoints.web.exposure.include=health,info
