
name: spendwise

services:
  postgres:
    image: postgres:18
    container_name: spendwise-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-spendwise}
      POSTGRES_USER: ${POSTGRES_USER:-spendwise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-development}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - spendwise-postgres18-data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: spendwise-backend
    restart: unless-stopped

    environment:
      SERVER_PORT: 8080

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-spendwise}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-spendwise}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-development}

      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      AUTH_SUCCESS_URL: ${AUTH_SUCCESS_URL:-http://localhost:5173/}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-local-google-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-local-google-client-secret}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-'{baseUrl}/login/oauth2/code/{registrationId}'}

      CHANNEL3_API_KEY: ${CHANNEL3_API_KEY:-}
      CHANNEL3_BASE_URL: ${CHANNEL3_BASE_URL:-https://api.trychannel3.com}
      CHANNEL3_SEARCH_LIMIT: ${CHANNEL3_SEARCH_LIMIT:-10}

      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      PAYPAL_BASE_URL: ${PAYPAL_BASE_URL:-https://api-m.sandbox.paypal.com}
      PAYPAL_RETURN_URL: ${PAYPAL_RETURN_URL:-http://localhost:3000/checkout/return}
      PAYPAL_CANCEL_URL: ${PAYPAL_CANCEL_URL:-http://localhost:3000/checkout/cancel}

      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      SPENDWISE_HTTP_CONNECT_TIMEOUT_SECONDS: ${SPENDWISE_HTTP_CONNECT_TIMEOUT_SECONDS:-5}
      SPENDWISE_HTTP_READ_TIMEOUT_SECONDS: ${SPENDWISE_HTTP_READ_TIMEOUT_SECONDS:-20}

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "${SERVER_PORT:-8080}:8080"

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

volumes:
  spendwise-postgres18-data:
